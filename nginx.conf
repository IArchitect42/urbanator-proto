server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 "ok\n"; }
    # La page du proto change à chaque version : pas de cache long sur le HTML
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    location ~* \.(png|svg|woff2?)$ { add_header Cache-Control "public, max-age=604800"; }
    location / { try_files $uri $uri/ =404; }
}
